name: Java Concurrency Log Pipeline CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Build, Test, and Package (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run Unit and Concurrency Integration Tests
        run: mvn -B clean test

      - name: Package Executable JAR
        run: mvn -B package -DskipTests

      - name: Verify CLI Execution (Sequential, Concurrent, Compare)
        run: |
          java -jar target/java-concurrency-log-pipeline.jar --mode sequential --events 10000
          java -jar target/java-concurrency-log-pipeline.jar --mode concurrent --workers 4 --queue-capacity 500 --events 10000
          java -jar target/java-concurrency-log-pipeline.jar --mode compare --workers 4 --events 50000

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: java-concurrency-log-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
